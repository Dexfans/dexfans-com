<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DexFans — Under Construction</title>

  <meta
    name="description"
    content="DexFans is building the next generation of creator-powered entertainment."
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    /* ------------------------------
       BACKGROUND
    ------------------------------ */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 35, 105, 0.13),
          transparent 28%
        ),
        radial-gradient(
          circle at 15% 80%,
          rgba(120, 40, 255, 0.10),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(255, 0, 90, 0.08),
          transparent 30%
        ),
        #050505;
    }

    .grid {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      transform: perspective(700px) rotateX(62deg);
      transform-origin: center center;

      animation: gridMove 12s linear infinite;
    }

    @keyframes gridMove {
      from {
        transform:
          perspective(700px)
          rotateX(62deg)
          translateY(0);
      }

      to {
        transform:
          perspective(700px)
          rotateX(62deg)
          translateY(55px);
      }
    }

    /* ------------------------------
       GLOW ORBS
    ------------------------------ */

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      pointer-events: none;
    }

    .orb.one {
      width: 280px;
      height: 280px;
      background: #ff176d;
      left: -80px;
      top: 20%;
      animation: floatOne 8s ease-in-out infinite;
    }

    .orb.two {
      width: 350px;
      height: 350px;
      background: #7b24ff;
      right: -120px;
      bottom: -100px;
      animation: floatTwo 10s ease-in-out infinite;
    }

    .orb.three {
      width: 180px;
      height: 180px;
      background: #ff0055;
      right: 15%;
      top: 10%;
      opacity: 0.18;
      animation: floatThree 7s ease-in-out infinite;
    }

    @keyframes floatOne {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(80px, -50px);
      }
    }

    @keyframes floatTwo {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-70px, -80px);
      }
    }

    @keyframes floatThree {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-50px, 80px) scale(1.2);
      }
    }

    /* ------------------------------
       NOISE
    ------------------------------ */

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      z-index: 10;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

      animation: noiseMove 0.2s steps(2) infinite;
    }

    @keyframes noiseMove {
      0% {
        transform: translate(0,0);
      }

      25% {
        transform: translate(2px,-1px);
      }

      50% {
        transform: translate(-1px,2px);
      }

      75% {
        transform: translate(1px,1px);
      }

      100% {
        transform: translate(0,0);
      }
    }

    /* ------------------------------
       HEADER
    ------------------------------ */

    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      height: 90px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6vw;

      z-index: 20;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: #ff176d;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;

      color: rgba(255,255,255,0.55);
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: #ff176d;

      box-shadow:
        0 0 8px #ff176d,
        0 0 18px rgba(255,23,109,0.7);

      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.35;
        transform: scale(0.7);
      }
    }

    /* ------------------------------
       MAIN
    ------------------------------ */

    main {
      position: relative;
      z-index: 15;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 100px 25px 60px;
      text-align: center;
    }

    .content {
      width: 100%;
      max-width: 900px;

      animation: reveal 1.2s ease forwards;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 9px 16px;

      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 100px;

      background: rgba(255,255,255,0.035);
      backdrop-filter: blur(15px);

      color: rgba(255,255,255,0.65);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 3px;
      text-transform: uppercase;

      margin-bottom: 30px;
    }

    .eyebrow i {
      width: 6px;
      height: 6px;
      background: #ff176d;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff176d;
    }

    h1 {
      font-size: clamp(58px, 10vw, 125px);
      line-height: 0.88;

      letter-spacing: -7px;
      font-weight: 900;

      margin-bottom: 30px;
    }

    h1 .gradient {
      background: linear-gradient(
        110deg,
        #ffffff 10%,
        #ff4d91 45%,
        #ff176d 70%,
        #9f36ff 100%
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      background-size: 250% auto;

      animation: gradientMove 5s ease-in-out infinite;
    }

    @keyframes gradientMove {
      0%, 100% {
        background-position: 0% center;
      }

      50% {
        background-position: 100% center;
      }
    }

    .subtitle {
      max-width: 620px;
      margin: 0 auto 40px;

      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.7;

      color: rgba(255,255,255,0.55);
    }

    /* ------------------------------
       CONSTRUCTION ANIMATION
    ------------------------------ */

    .construction {
      width: min(500px, 85vw);
      margin: 0 auto 35px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;

      margin-bottom: 9px;

      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 2px;

      color: rgba(255,255,255,0.35);
    }

    .progress {
      height: 3px;
      width: 100%;

      background: rgba(255,255,255,0.08);

      overflow: hidden;
      border-radius: 20px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background: linear-gradient(
        90deg,
        #ff176d,
        #ff5b9b,
        #9f36ff
      );

      box-shadow:
        0 0 15px rgba(255,23,109,0.8);

      animation: loading 4s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        width: 5%;
      }

      50% {
        width: 87%;
      }

      80% {
        width: 64%;
      }

      100% {
        width: 5%;
      }
    }

    /* ------------------------------
       BUTTON
    ------------------------------ */

    .button {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      padding: 15px 24px;

      color: #fff;
      text-decoration: none;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 1.5px;
      text-transform: uppercase;

      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 100px;

      background: rgba(255,255,255,0.045);
      backdrop-filter: blur(20px);

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .button:hover {
      transform: translateY(-3px);

      background: rgba(255,23,109,0.12);

      border-color: rgba(255,23,109,0.5);

      box-shadow:
        0 10px 40px rgba(255,23,109,0.15);
    }

    .arrow {
      font-size: 16px;
      transition: transform 0.3s ease;
    }

    .button:hover .arrow {
      transform: translateX(4px);
    }

    /* ------------------------------
       FOOTER
    ------------------------------ */

    footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 25px;

      z-index: 20;

      display: flex;
      justify-content: center;

      color: rgba(255,255,255,0.25);

      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ------------------------------
       FLOATING PARTICLES
    ------------------------------ */

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;

      width: 2px;
      height: 2px;

      background: #fff;
      border-radius: 50%;

      opacity: 0;

      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(20px);
        opacity: 0;
      }

      15% {
        opacity: 0.5;
      }

      85% {
        opacity: 0.3;
      }

      100% {
        transform: translateY(-120px);
        opacity: 0;
      }
    }

    /* ------------------------------
       MOBILE
    ------------------------------ */

    @media (max-width: 600px) {

      header {
        height: 75px;
        padding: 0 22px;
      }

      .logo {
        font-size: 21px;
      }

      .status {
        font-size: 8px;
        letter-spacing: 1.5px;
      }

      h1 {
        letter-spacing: -4px;
        font-size: clamp(55px, 17vw, 90px);
      }

      .subtitle {
        font-size: 14px;
        line-height: 1.6;
        padding: 0 10px;
      }

      footer {
        bottom: 18px;
        font-size: 7px;
      }
    }

  </style>
</head>

<body>

  <div class="background">
    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <div class="particles" id="particles"></div>
  </div>

  <div class="noise"></div>

  <header>

    <div class="logo">
      DEX<span>FANS</span>
    </div>

    <div class="status">
      <div class="status-dot"></div>
      System Building
    </div>

  </header>

  <main>

    <div class="content">

      <div class="eyebrow">
        <i></i>
        Something is coming
      </div>

      <h1>
        WE'RE<br>
        <span class="gradient">BUILDING.</span>
      </h1>

      <p class="subtitle">
        DexFans is evolving into something bigger.
        The next generation of creator-powered entertainment
        is currently under construction.
      </p>

      <div class="construction">

        <div class="progress-top">
          <span>Construction status</span>
          <span>In progress</span>
        </div>

        <div class="progress">
          <div class="progress-bar"></div>
        </div>

      </div>

      <a
        href="https://dexfans.com"
        class="button"
      >
        Enter DexFans
        <span class="arrow">→</span>
      </a>

    </div>

  </main>

  <footer>
    DEXFANS © 2026 — THE FUTURE IS LOADING
  </footer>

  <script>

    /* ------------------------------
       PARTICLES
    ------------------------------ */

    const container = document.getElementById("particles");

    for (let i = 0; i < 55; i++) {

      const particle = document.createElement("div");

      particle.className = "particle";

      particle.style.left =
        Math.random() * 100 + "%";

      particle.style.top =
        (30 + Math.random() * 70) + "%";

      particle.style.animationDuration =
        (5 + Math.random() * 9) + "s";

      particle.style.animationDelay =
        Math.random() * 8 + "s";

      particle.style.transform =
        `scale(${0.5 + Math.random() * 2})`;

      container.appendChild(particle);
    }


    /* ------------------------------
       MOUSE PARALLAX
    ------------------------------ */

    const grid = document.querySelector(".grid");

    document.addEventListener("mousemove", (e) => {

      const x =
        (e.clientX / window.innerWidth - 0.5);

      const y =
        (e.clientY / window.innerHeight - 0.5);

      grid.style.marginLeft =
        `${x * 18}px`;

      grid.style.marginTop =
        `${y * 18}px`;

    });


    /* ------------------------------
       RANDOM TITLE GLITCH
    ------------------------------ */

    const title = document.querySelector(".gradient");

    setInterval(() => {

      title.style.transform =
        "translateX(-2px)";

      setTimeout(() => {

        title.style.transform =
          "translateX(2px)";

      }, 60);

      setTimeout(() => {

        title.style.transform =
          "translateX(0)";

      }, 120);

    }, 5000);

  </script>

</body>
</html>
