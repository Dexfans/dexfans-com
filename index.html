<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DexFans — New Build Coming Soon</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030305;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  touch-action: none;
}

body {
  position: relative;
}

/* =========================
   BACKGROUND
========================= */

.background {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255, 20, 105, .12),
      transparent 32%
    ),
    radial-gradient(
      circle at 15% 90%,
      rgba(120, 30, 255, .10),
      transparent 30%
    ),
    #030305;
}

.grid {
  position: absolute;
  width: 220%;
  height: 220%;
  left: -60%;
  top: -35%;

  background-image:
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size: 55px 55px;

  transform:
    perspective(700px)
    rotateX(64deg);

  animation: gridMove 8s linear infinite;
}

@keyframes gridMove {
  from {
    background-position: 0 0;
  }

  to {
    background-position: 0 55px;
  }
}

/* =========================
   HEADER
========================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;

  height: 82px;

  padding: 0 28px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  z-index: 50;

  pointer-events: none;
}

.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: -1.5px;
}

.logo span {
  color: #ff176d;
}

.build {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;

  color: rgba(255,255,255,.55);

  display: flex;
  align-items: center;
  gap: 8px;
}

.build-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;

  background: #ff176d;

  box-shadow:
    0 0 8px #ff176d,
    0 0 20px #ff176d;

  animation: pulse 1.3s infinite;
}

@keyframes pulse {
  0%,100% {
    opacity: 1;
    transform: scale(1);
  }

  50% {
    opacity: .35;
    transform: scale(.65);
  }
}

/* =========================
   GAME
========================= */

#game {
  position: fixed;
  inset: 0;
  z-index: 10;
}

/* =========================
   CENTER MESSAGE
========================= */

.message {
  position: fixed;

  top: 105px;
  left: 50%;

  transform: translateX(-50%);

  width: 90%;

  text-align: center;

  z-index: 30;

  pointer-events: none;
}

.message h1 {
  font-size: clamp(38px, 8vw, 78px);

  line-height: .9;

  font-weight: 900;

  letter-spacing: -4px;

  background:
    linear-gradient(
      110deg,
      #fff,
      #ff4d91,
      #ff176d,
      #a337ff
    );

  background-size: 250% auto;

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;

  animation: gradient 5s ease infinite;
}

@keyframes gradient {
  0%,100% {
    background-position: 0%;
  }

  50% {
    background-position: 100%;
  }
}

.message p {
  margin-top: 12px;

  font-size: 10px;

  text-transform: uppercase;

  letter-spacing: 3px;

  color: rgba(255,255,255,.38);
}

/* =========================
   SCORE
========================= */

.score {
  position: fixed;

  top: 32px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 40;

  text-align: center;

  pointer-events: none;
}

.score-label {
  font-size: 8px;
  letter-spacing: 3px;
  text-transform: uppercase;

  color: rgba(255,255,255,.35);
}

.score-number {
  margin-top: 2px;

  font-size: 23px;
  font-weight: 900;

  letter-spacing: 1px;
}

/* =========================
   GAME OBJECTS
========================= */

.player {
  position: absolute;

  width: 64px;
  height: 64px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ff8ab6,
      #ff176d 45%,
      #8d0b42
    );

  border: 2px solid rgba(255,255,255,.7);

  box-shadow:
    0 0 15px rgba(255,23,109,.8),
    0 0 45px rgba(255,23,109,.35);

  z-index: 20;

  transition: transform .08s linear;
}

.player::after {
  content: "◆";

  font-size: 19px;

  color: white;

  text-shadow:
    0 0 12px white;
}

.collectible {
  position: absolute;

  width: 42px;
  height: 42px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: rgba(0,0,0,.6);

  border: 2px solid rgba(255,255,255,.55);

  box-shadow:
    0 0 12px rgba(255,30,120,.8),
    0 0 35px rgba(255,30,120,.25);

  z-index: 15;

  animation: spin 3s linear infinite;
}

.collectible img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sol {
  box-shadow:
    0 0 12px rgba(153,69,255,.9),
    0 0 35px rgba(20,241,149,.25);
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.enemy {
  position: absolute;

  width: 18px;
  height: 18px;

  border-radius: 4px;

  background:
    linear-gradient(
      135deg,
      #ff004f,
      #ff5c9b
    );

  box-shadow:
    0 0 12px #ff004f,
    0 0 28px rgba(255,0,79,.35);

  transform: rotate(45deg);

  z-index: 14;
}

/* =========================
   COMBO
========================= */

.combo {
  position: fixed;

  left: 50%;
  top: 55%;

  transform:
    translate(-50%, -50%)
    scale(.6);

  opacity: 0;

  font-size: 25px;
  font-weight: 900;

  color: white;

  text-shadow:
    0 0 20px #ff176d;

  z-index: 60;

  pointer-events: none;
}

.combo.show {
  animation: combo .65s ease forwards;
}

@keyframes combo {
  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(.6);
  }

  30% {
    opacity: 1;
    transform:
      translate(-50%, -60%)
      scale(1.15);
  }

  100% {
    opacity: 0;
    transform:
      translate(-50%, -90%)
      scale(1);
  }
}

/* =========================
   GAME OVER
========================= */

.gameover {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;

  align-items: center;
  justify-content: center;

  text-align: center;

  background: rgba(0,0,0,.78);

  backdrop-filter: blur(18px);
}

.gameover.active {
  display: flex;
}

.gameover-box {
  width: min(400px, 88vw);

  padding: 40px 25px;

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 25px;

  background:
    rgba(15,15,20,.75);

  box-shadow:
    0 25px 80px rgba(0,0,0,.5);
}

.gameover h2 {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: -2px;
}

.final-score {
  margin: 12px 0 25px;

  color: rgba(255,255,255,.5);

  font-size: 13px;
}

.restart {
  border: 0;

  padding: 15px 28px;

  border-radius: 100px;

  background:
    linear-gradient(
      90deg,
      #ff176d,
      #9b36ff
    );

  color: white;

  font-weight: 800;

  letter-spacing: 1px;

  cursor: pointer;
}

/* =========================
   PARTNERS
========================= */

.partners {
  position: fixed;

  bottom: 28px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  gap: 18px;

  z-index: 40;

  pointer-events: none;
}

.partner {
  width: 46px;
  height: 46px;

  border-radius: 50%;

  padding: 3px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.4),
      rgba(255,255,255,.05)
    );

  box-shadow:
    0 0 25px rgba(255,255,255,.08);
}

.partner-inner {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  overflow: hidden;

  background: #08080c;

  display: flex;
  align-items: center;
  justify-content: center;
}

.partner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.partner.solana img {
  object-fit: contain;
  padding: 9px;
}

.partner-label {
  position: absolute;

  bottom: -18px;

  left: 50%;

  transform: translateX(-50%);

  white-space: nowrap;

  font-size: 7px;

  letter-spacing: 1.5px;

  text-transform: uppercase;

  color: rgba(255,255,255,.25);
}

/* =========================
   INSTRUCTIONS
========================= */

.instructions {
  position: fixed;

  bottom: 85px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 40;

  color: rgba(255,255,255,.25);

  font-size: 8px;

  text-transform: uppercase;

  letter-spacing: 2px;

  text-align: center;

  pointer-events: none;
}

@media(max-width:600px) {

  header {
    padding: 0 18px;
  }

  .logo {
    font-size: 20px;
  }

  .message {
    top: 92px;
  }

  .message h1 {
    letter-spacing: -3px;
  }

  .player {
    width: 58px;
    height: 58px;
  }

  .instructions {
    bottom: 78px;
  }

  .partners {
    bottom: 19px;
  }

  .partner {
    width: 42px;
    height: 42px;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="grid"></div>
</div>

<header>
  <div class="logo">
    DEX<span>FANS</span>
  </div>

  <div class="build">
    <span class="build-dot"></span>
    New Build
  </div>
</header>

<div class="score">
  <div class="score-label">Score</div>
  <div class="score-number" id="score">000000</div>
</div>

<div class="message">
  <h1>NEW BUILD<br>COMING SOON</h1>
  <p>Keep playing while we build</p>
</div>

<div id="game"></div>

<div class="combo" id="combo">
  +100
</div>

<div class="instructions">
  Touch & drag to move
</div>

<!-- PARTNER LOGOS -->

<div class="partners">

  <div class="partner">
    <div class="partner-inner">
      <img
        src="https://gojipower.xyz/goji-logo.png"
        alt="GOJIPOWER"
      >
    </div>
    <div class="partner-label">
      GOJIPOWER
    </div>
  </div>

  <div class="partner solana">
    <div class="partner-inner">
      <img
        src="https://solana.com/src/img/branding/solanaLogoMark.png"
        alt="Solana"
      >
    </div>
    <div class="partner-label">
      SOLANA
    </div>
  </div>

</div>

<!-- GAME OVER -->

<div class="gameover" id="gameover">

  <div class="gameover-box">

    <h2>GAME OVER</h2>

    <div class="final-score">
      Score: <strong id="finalScore">0</strong>
    </div>

    <button
      class="restart"
      onclick="restartGame()"
    >
      PLAY AGAIN
    </button>

  </div>

</div>

<script>

/* =========================
   GAME CONFIG
========================= */

const game = document.getElementById("game");

const scoreElement =
  document.getElementById("score");

const comboElement =
  document.getElementById("combo");

const gameover =
  document.getElementById("gameover");

const finalScore =
  document.getElementById("finalScore");

let player;

let playerX;
let playerY;

let score = 0;

let speed = 2;

let running = true;

let objects = [];

let lastTime = 0;

let spawnTimer = 0;

let enemyTimer = 0;

let combo = 0;


/* =========================
   CREATE PLAYER
========================= */

function createPlayer() {

  player = document.createElement("div");

  player.className = "player";

  game.appendChild(player);

  playerX =
    window.innerWidth / 2 - 32;

  playerY =
    window.innerHeight - 170;

  updatePlayer();
}

function updatePlayer() {

  player.style.left =
    playerX + "px";

  player.style.top =
    playerY + "px";
}


/* =========================
   MOVE PLAYER
========================= */

function movePlayer(x, y) {

  playerX =
    Math.max(
      5,
      Math.min(
        window.innerWidth - 69,
        x - 32
      )
    );

  playerY =
    Math.max(
      180,
      Math.min(
        window.innerHeight - 100,
        y - 32
      )
    );

  updatePlayer();
}


/* =========================
   TOUCH
========================= */

document.addEventListener(
  "touchmove",
  function(e) {

    if (!running) return;

    const touch =
      e.touches[0];

    movePlayer(
      touch.clientX,
      touch.clientY
    );

  },
  { passive: false }
);


/* =========================
   MOUSE
========================= */

document.addEventListener(
  "mousemove",
  function(e) {

    if (!running) return;

    movePlayer(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================
   CREATE COLLECTIBLE
========================= */

function createCollectible(type) {

  const item =
    document.createElement("div");

  item.className =
    "collectible " +
    (type === "sol" ? "sol" : "");

  const img =
    document.createElement("img");

  if (type === "sol") {

    img.src =
      "https://solana.com/src/img/branding/solanaLogoMark.png";

    img.alt = "Solana";

  } else {

    img.src =
      "https://gojipower.xyz/goji-logo.png";

    img.alt = "GOJIPOWER";
  }

  item.appendChild(img);

  item.style.left =
    Math.random() *
    (window.innerWidth - 50) +
    "px";

  item.style.top =
    "-60px";

  game.appendChild(item);

  objects.push({
    element: item,
    type: "collectible",
    y: -60,
    value: type === "sol" ? 250 : 100
  });
}


/* =========================
   CREATE ENEMY
========================= */

function createEnemy() {

  const enemy =
    document.createElement("div");

  enemy.className =
    "enemy";

  enemy.style.left =
    Math.random() *
    (window.innerWidth - 25) +
    "px";

  enemy.style.top =
    "-30px";

  game.appendChild(enemy);

  objects.push({
    element: enemy,
    type: "enemy",
    y: -30,
    value: 0
  });
}


/* =========================
   COLLISION
========================= */

function collision(a, b) {

  const ar =
    a.getBoundingClientRect();

  const br =
    b.getBoundingClientRect();

  return !(
    ar.right < br.left ||
    ar.left > br.right ||
    ar.bottom < br.top ||
    ar.top > br.bottom
  );
}


/* =========================
   SCORE
========================= */

function addScore(amount) {

  score += amount;

  scoreElement.textContent =
    String(score).padStart(6, "0");

  combo++;

  comboElement.textContent =
    "+" + amount;

  comboElement.classList.remove("show");

  void comboElement.offsetWidth;

  comboElement.classList.add("show");

  /*
     Never ending difficulty.
  */

  speed =
    Math.min(
      9,
      2 + score / 1800
    );
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(timestamp) {

  if (!running) return;

  const delta =
    timestamp - lastTime;

  lastTime = timestamp;

  spawnTimer += delta;

  enemyTimer += delta;


  /* COLLECTIBLES */

  if (spawnTimer > 750) {

    spawnTimer = 0;

    createCollectible(
      Math.random() > .82
        ? "sol"
        : "goji"
    );
  }


  /* ENEMIES */

  if (enemyTimer > 1200) {

    enemyTimer = 0;

    createEnemy();

    /*
       More enemies over time.
    */

    if (score > 1000 &&
        Math.random() > .5) {

      setTimeout(
        createEnemy,
        250
      );
    }
  }


  /* MOVE OBJECTS */

  for (
    let i = objects.length - 1;
    i >= 0;
    i--
  ) {

    const obj =
      objects[i];

    obj.y +=
      speed *
      (delta / 16);

    obj.element.style.top =
      obj.y + "px";


    /* COLLISION */

    if (
      collision(
        player,
        obj.element
      )
    ) {

      if (
        obj.type ===
        "collectible"
      ) {

        addScore(
          obj.value
        );

        obj.element.remove();

        objects.splice(i, 1);

        continue;

      } else {

        endGame();

        return;
      }
    }


    /* REMOVE OFF SCREEN */

    if (
      obj.y >
      window.innerHeight + 80
    ) {

      obj.element.remove();

      objects.splice(i, 1);
    }
  }


  requestAnimationFrame(
    gameLoop
  );
}


/* =========================
   GAME OVER
========================= */

function endGame() {

  running = false;

  finalScore.textContent =
    score;

  gameover.classList.add(
    "active"
  );
}


/* =========================
   RESTART
========================= */

function restartGame() {

  objects.forEach(
    obj =>
      obj.element.remove()
  );

  objects = [];

  score = 0;

  speed = 2;

  combo = 0;

  scoreElement.textContent =
    "000000";

  gameover.classList.remove(
    "active"
  );

  playerX =
    window.innerWidth / 2 - 32;

  playerY =
    window.innerHeight - 170;

  updatePlayer();

  running = true;

  lastTime =
    performance.now();

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================
   START
========================= */

createPlayer();

lastTime =
  performance.now();

requestAnimationFrame(
  gameLoop
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  () => {

    playerX =
      Math.min(
        playerX,
        window.innerWidth - 69
      );

    playerY =
      Math.min(
        playerY,
        window.innerHeight - 100
      );

    updatePlayer();

  }
);

</script>

</body>
</html>
